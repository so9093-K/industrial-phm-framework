[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "industrial-phm-framework"
version = "0.1.0"
description = "Modular PHM framework for heterogeneous industrial time-series data."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"
authors = [
  { name = "so9093-K" },
]
keywords = [
  "phm",
  "predictive-maintenance",
  "time-series",
  "industrial-ai",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.0.0,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.uv]
required-version = ">=0.10,<0.11"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_phm"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["industrial_phm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["industrial_phm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
