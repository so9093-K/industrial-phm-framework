pid /tmp/nginx.pid;
events {}
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # The application enforces its own 20 MiB decoded CSV upload limit.
    client_max_body_size 28m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    # Preserve Origin, Sec-Fetch-Site and CSRF headers. Never synthesize trust.
    server {
        listen 8080;
        location / { proxy_pass http://127.0.0.1:2718; }
    }
    # Compose pins the isolated example to this published loopback port.
    server {
        listen 8081;
        location / { proxy_pass http://127.0.0.1:2719; }
    }
    # AI explanations stay on a loopback endpoint (127.0.0.1:9400/v1) inside this shared
    # namespace; the OpenAI-compatible model server itself runs on the host. Not published.
    server {
        listen 127.0.0.1:9400;
        location / { proxy_pass http://host.docker.internal:9400; }
    }
}
