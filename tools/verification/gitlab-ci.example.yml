# Optional GitLab CI thin adapter example (not activated here).
# It calls the same CLI; no CI-specific verdict implementation.
verification-foundation:
  image: python:3.14
  script:
    - pip install uv==0.12.13
    - uv sync --locked --extra operations --extra aihub
    - uv run --no-sync python tools/verification/verify.py run verification-smoke
  artifacts:
    when: always
    paths:
      - artifacts/verification/
