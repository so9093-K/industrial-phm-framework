name: Generate history lock

on:
  push:
    branches: [feat/ducklake-asset-history]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Generate lock
        run: uv lock

      - name: Emit lock
        run: |
          echo 'LOCK_BASE64_BEGIN'
          base64 -w0 uv.lock
          echo
          echo 'LOCK_BASE64_END'
