name: Interactive Analysis

on:
  pull_request:
    paths:
      - ".github/workflows/interactive-analysis.yml"
      - "notebooks/*.py"
      - "apps/*.py"
      - "src/industrial_phm/apps/**"
      - "src/industrial_phm/analysis/**"
      - "src/industrial_phm/application/**"
      - "src/industrial_phm/presentation/**"
      - "tests/integration/test_operations_v2_app.py"
      - "src/industrial_phm/adapters/csv_sensor.py"
      - "src/industrial_phm/contracts/quality.py"
      - "src/industrial_phm/genai/**"
      - "src/industrial_phm/experiments/xjtu_characterization_artifacts.py"
      - "src/industrial_phm/experiments/result_inspection.py"
      - "src/industrial_phm/experiments/result_inspection_support.py"
      - "src/industrial_phm/experiments/*inspection*.py"
      - "docs/research/results/xjtu-sy-lstm-autoencoder-fold-1-development-v1.json"
      - "docs/research/results/ims-bearings-iforest-single-channel-cross-test-v1.json"
      - "docs/research/results/mimii-due-iforest-domain-shift-development-v1.json"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/interactive-analysis.yml"
      - "notebooks/*.py"
      - "apps/*.py"
      - "src/industrial_phm/apps/**"
      - "src/industrial_phm/analysis/**"
      - "src/industrial_phm/application/**"
      - "src/industrial_phm/presentation/**"
      - "tests/integration/test_operations_v2_app.py"
      - "src/industrial_phm/adapters/csv_sensor.py"
      - "src/industrial_phm/contracts/quality.py"
      - "src/industrial_phm/genai/**"
      - "src/industrial_phm/experiments/xjtu_characterization_artifacts.py"
      - "src/industrial_phm/experiments/result_inspection.py"
      - "src/industrial_phm/experiments/result_inspection_support.py"
      - "src/industrial_phm/experiments/*inspection*.py"
      - "docs/research/results/xjtu-sy-lstm-autoencoder-fold-1-development-v1.json"
      - "docs/research/results/ims-bearings-iforest-single-channel-cross-test-v1.json"
      - "docs/research/results/mimii-due-iforest-domain-shift-development-v1.json"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: interactive-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marimo-check:
    name: Python 3.14 marimo check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Check dependency lock
        run: uv lock --check

      - name: Sync locked research environment
        run: uv sync --locked --group research --extra operations

      - name: Check marimo analysis files
        run: |
          uv run --locked --group research --extra operations marimo check --strict \
            notebooks/*.py apps/*.py src/industrial_phm/apps/operations_v2.py

      - name: Render Operations with analysis results and review requests
        run: |
          uv run --locked --group research --extra operations pytest \
            tests/integration/test_operations_v2_app.py

      - name: Execute Developer Workbench across validated experiment evidence
        run: |
          INDUSTRIAL_PHM_WORKBENCH_ARTIFACT=docs/research/results/xjtu-sy-lstm-autoencoder-fold-1-development-v1.json \
            uv run --locked --group research marimo export html \
            notebooks/02_developer_workbench.py \
            --no-include-code \
            --output /tmp/developer-workbench-xjtu-lstm.html
          INDUSTRIAL_PHM_WORKBENCH_ARTIFACT=docs/research/results/xjtu-sy-iforest-fold-1-holdout-v1.json \
            uv run --locked --group research marimo export html \
            notebooks/02_developer_workbench.py \
            --no-include-code \
            --output /tmp/developer-workbench-xjtu-iforest.html
          INDUSTRIAL_PHM_WORKBENCH_ARTIFACT=docs/research/results/ims-bearings-iforest-single-channel-cross-test-v1.json \
            uv run --locked --group research marimo export html \
            notebooks/02_developer_workbench.py \
            --no-include-code \
            --output /tmp/developer-workbench-ims-iforest.html

      - name: Execute PHM Analysis Explorer across supported surfaces
        run: |
          INDUSTRIAL_PHM_ANALYSIS_ARTIFACT=docs/research/results/xjtu-sy-lstm-autoencoder-fold-1-development-v1.json \
            uv run --locked --group research marimo export html \
            apps/analysis_explorer.py \
            --no-include-code \
            --output /tmp/analysis-explorer-xjtu-detailed.html
          INDUSTRIAL_PHM_ANALYSIS_ARTIFACT=docs/research/results/ims-bearings-iforest-single-channel-cross-test-v1.json \
            uv run --locked --group research marimo export html \
            apps/analysis_explorer.py \
            --no-include-code \
            --output /tmp/analysis-explorer-ims-inspection.html
          INDUSTRIAL_PHM_ANALYSIS_ARTIFACT=docs/research/results/mimii-due-iforest-domain-shift-development-v1.json \
            uv run --locked --group research marimo export html \
            apps/analysis_explorer.py \
            --no-include-code \
            --output /tmp/analysis-explorer-mimii-inspection.html

      - name: Execute PHM Operations V2 registered-source surfaces
        run: |
          uv run --locked --group research python - <<'PY'
          from datetime import datetime
          from pathlib import Path

          from industrial_phm.application import (
              FileSourceConfig,
              FileSourceMode,
              JsonSourceRepository,
              JsonSourceRuntimeRepository,
              OpcUaSourceConfig,
              RegisteredSource,
              SourceConnectionAttemptEvidence,
              SourceConnectionAttemptOperation,
              SourceConnectionAttemptOutcome,
          )
          from industrial_phm.connectors import OpcUaNodeMapping

          file_workspace = Path("/tmp/operations-file-workspace")
          file_workspace.mkdir(parents=True, exist_ok=True)
          repository = JsonSourceRepository(file_workspace / "sources.json")
          repository.register(
              RegisteredSource(
                  source_id="ci-registered-file",
                  name="CI registered file source",
                  config=FileSourceConfig(
                      source_path="/tmp/operations-observation.csv",
                      asset_id="ci-pump-01",
                      measurement_point_id="drive-end-bearing",
                      channel_columns=("vibration_x", "temperature"),
                      mode=FileSourceMode.SNAPSHOT,
                      timestamp_column="timestamp",
                      sampling_rate_hz=1.0,
                  ),
                  registered_at=datetime.fromisoformat("2026-09-23T09:00:00+09:00"),
              )
          )
          repository.register(
              RegisteredSource(
                  source_id="ci-opcua",
                  name="CI OPC UA source",
                  config=OpcUaSourceConfig(
                      endpoint_url="opc.tcp://127.0.0.1:4840",
                      asset_id="ci-pump-02",
                      measurement_point_id="drive-end-bearing",
                      node_mappings=(
                          OpcUaNodeMapping(
                              channel_id="vibration_x",
                              node_id="ns=2;s=Machine/VibrationX",
                          ),
                      ),
                      timeout_seconds=2.0,
                  ),
                  registered_at=datetime.fromisoformat("2026-09-23T09:05:00+09:00"),
              )
          )

          opcua_workspace = Path("/tmp/operations-opcua-workspace")
          opcua_workspace.mkdir(parents=True, exist_ok=True)
          opcua_repository = JsonSourceRepository(opcua_workspace / "sources.json")
          opcua_repository.register(
              RegisteredSource(
                  source_id="ci-opcua",
                  name="CI OPC UA source",
                  config=OpcUaSourceConfig(
                      endpoint_url="opc.tcp://127.0.0.1:4840",
                      asset_id="ci-pump-02",
                      measurement_point_id="drive-end-bearing",
                      node_mappings=(
                          OpcUaNodeMapping(
                              channel_id="vibration_x",
                              node_id="ns=2;s=Machine/VibrationX",
                          ),
                      ),
                      timeout_seconds=2.0,
                  ),
                  registered_at=datetime.fromisoformat("2026-09-23T09:05:00+09:00"),
              )
          )
          runtime_repository = JsonSourceRuntimeRepository(
              opcua_workspace / "source-runtime.json"
          )
          runtime_repository.record_connection_attempt(
              SourceConnectionAttemptEvidence(
                  source_id="ci-opcua",
                  operation=SourceConnectionAttemptOperation.OPCUA_READ,
                  outcome=SourceConnectionAttemptOutcome.SUCCEEDED,
                  attempted_at=datetime.fromisoformat("2026-09-23T09:10:00+09:00"),
                  connected_at=datetime.fromisoformat("2026-09-23T09:10:01+09:00"),
                  completed_at=datetime.fromisoformat("2026-09-23T09:10:02+09:00"),
              )
          )
          PY

          cat > /tmp/operations-observation.csv <<'EOF'
          timestamp,vibration_x,temperature
          2026-09-22T10:00:00+09:00,-1.0,42.0
          2026-09-22T10:00:01+09:00,0.0,42.2
          2026-09-22T10:00:02+09:00,1.0,42.4
          EOF
          INDUSTRIAL_PHM_OPERATIONS_WORKSPACE=/tmp/operations-file-workspace \
            uv run --locked --group research --extra operations marimo export html \
            src/industrial_phm/apps/operations_v2.py \
            --no-include-code \
            --output /tmp/phm-operations-file-registry.html

          INDUSTRIAL_PHM_OPERATIONS_WORKSPACE=/tmp/operations-file-workspace \
          INDUSTRIAL_PHM_OPERATIONS_REGISTRATION_TYPE=opcua \
            uv run --locked --group research --extra operations marimo export html \
            src/industrial_phm/apps/operations_v2.py \
            --no-include-code \
            --output /tmp/phm-operations-opcua-registration.html

          INDUSTRIAL_PHM_OPERATIONS_WORKSPACE=/tmp/operations-opcua-workspace \
            uv run --locked --group research --extra operations marimo export html \
            src/industrial_phm/apps/operations_v2.py \
            --no-include-code \
            --output /tmp/phm-operations-opcua-attempt-evidence.html

          mkdir -p /tmp/operations-invalid-workspace
          printf '{not-json' > /tmp/operations-invalid-workspace/sources.json
          INDUSTRIAL_PHM_OPERATIONS_WORKSPACE=/tmp/operations-invalid-workspace \
            uv run --locked --group research --extra operations marimo export html \
            src/industrial_phm/apps/operations_v2.py \
            --no-include-code \
            --output /tmp/phm-operations-invalid-registry.html
