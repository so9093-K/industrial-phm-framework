name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Fast source feedback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv python install 3.14
      - name: Lock and source formatting
        run: |
          uv lock --check
          uv sync --locked --group dev
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Core data contracts
        run: |
          uv run --no-sync pytest -q --maxfail=1 \
            tests/unit/test_timeseries_contract.py \
            tests/unit/test_data_quality.py \
            tests/unit/test_csv_sensor_adapter.py \
            tests/unit/test_measurement_semantics.py \
            tests/contract/test_preprocessing_contract.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Web source checks
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run --prefix frontend check
          npm test --prefix frontend
          npm run --prefix frontend build
