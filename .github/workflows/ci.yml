name: CI

on:
  pull_request:
  push:
    branches: [main]
  # One scheduled product acceptance instead of browser/container/wheel gates on every PR.
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Check dependency lock
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --extra operations --extra aihub

      - name: Lint
        run: uv run --locked --extra operations --extra aihub ruff check .

      - name: Format check
        run: uv run --locked --extra operations --extra aihub ruff format --check .

      - name: Type check
        run: uv run --locked --extra operations --extra aihub mypy

      - name: Unit and contract tests
        run: uv run --locked --extra operations --extra aihub pytest tests/unit tests/contract --durations=20

  # Not a second PR gate: product acceptance runs weekly or when explicitly dispatched.
  product-acceptance:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'chore/ci-test-declutter')
    name: Product acceptance (browser, wheel, container)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync product dependencies
        run: uv sync --locked --extra operations --extra aihub

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Check current Web and run frontend tests
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run --prefix frontend check
          npm test --prefix frontend

      - name: Build distributable wheel from source archive
        run: uv build

      - name: Check installed wheel contains complete Web assets
        run: |
          uv venv /tmp/phm-installed-wheel --python 3.14
          uv pip install --python /tmp/phm-installed-wheel/bin/python --no-deps dist/*.whl
          # Inspect installed distribution with a PATH that cannot resolve Node/npm.
          PATH=/tmp/phm-no-node /tmp/phm-installed-wheel/bin/python - <<'PY'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          from shutil import which

          assert which('node') is None and which('npm') is None
          wheel = distribution("industrial-phm-framework")
          root = Path(wheel.locate_file("industrial_phm/apps/web_next"))
          names = json.loads((root / "asset-manifest.json").read_text())
          assert "index.html" in names and any(n.endswith(".js") for n in names)
          assert len(names) == len(set(names))
          assert all((root / n).is_file() and (root / n).stat().st_size > 0 for n in names)
          print(f"Installed wheel Web assets: {len(names)}")
          PY

      - name: Integration regression
        run: uv run --no-sync pytest tests/integration --maxfail=1 -q -rs --durations=15

      - name: Install browser runtime
        run: |
          uv pip install --python .venv/bin/python "playwright==1.64.0"
          uv run --no-sync playwright install --with-deps chromium

      - name: Browser and supervised-node acceptance
        run: uv run --no-sync pytest tests/acceptance --maxfail=1 -q -rs --durations=15

      - name: Real Compose boot, Web response, restart
        run: |
          trap 'docker compose --env-file /dev/null -f compose.yaml down --timeout 60 || true' EXIT
          make container-up
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:2718/web/ >/dev/null
          docker compose --env-file /dev/null -f compose.yaml restart
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:2718/web/ >/dev/null; then
              echo 'Compose Web serves after restart'
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /dev/null -f compose.yaml logs --tail 100
          exit 1
