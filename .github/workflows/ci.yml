name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Check dependency lock
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --extra operations

      - name: Lint
        run: uv run --locked --extra operations ruff check .

      - name: Format check
        run: uv run --locked --extra operations ruff format --check .

      - name: Type check
        run: uv run --locked --extra operations mypy

      - name: Unit and contract tests
        run: uv run --locked --extra operations pytest tests/unit tests/contract
