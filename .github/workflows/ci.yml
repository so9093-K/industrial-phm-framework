name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load verification toolchain pins
        run: grep -v '^#' tools/verify/versions.env >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Check dependency lock
        run: sh tools/verify/gate.sh lock

      - name: Sync locked environment
        run: uv sync --locked --extra operations

      - name: Lint
        run: sh tools/verify/gate.sh lint

      - name: Format check
        run: sh tools/verify/gate.sh format

      - name: Type check
        run: sh tools/verify/gate.sh types

      - name: Unit and contract tests
        run: sh tools/verify/gate.sh unit
