name: TEMP 317-A Compaction Benchmark

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-compaction-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: DuckLake N-scale compaction benchmark (N=${{ matrix.n }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        n: [0, 2000, 10000]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync history runtime
        run: uv sync --locked --extra history

      - name: Run N-scale benchmark
        run: |
          uv run --no-sync python -m tools.history.compaction_benchmark \
            --root "artifacts/compaction-n${{ matrix.n }}" \
            --commits "${{ matrix.n }}" \
            --events-per-commit 35 \
            --channels 35 \
            --max-compacted-files 32 \
            --max-file-size-bytes 1048576

      - name: Summarize measurements
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          n = ${{ matrix.n }}
          report = json.loads(
              (Path(f"artifacts/compaction-n{n}") / "compaction-benchmark.json").read_text()
          )
          at_n = report["storage_at_n"]
          memory_at_n = report["process_memory_at_n"]
          compact = report["compaction"]
          before = compact["storage_before"]
          after = compact["storage_after"]
          memory_before = report["process_memory_before_compaction"]
          memory_after = report["process_memory_after_compaction"]
          append_before = report["append_before_compaction"]
          append_after = report["append_after_compaction"]
          aggregate_before = report["query_before_compaction"].get("aggregate")
          aggregate_after = report["query_after_compaction"].get("aggregate")
          print(
              json.dumps(
                  {
                      "n": n,
                      "active_files_at_n": at_n["active_data_file_count"],
                      "active_files_pre_compaction": before["active_data_file_count"],
                      "active_files_after": after["active_data_file_count"],
                      "scheduled_after": after["scheduled_for_deletion_count"],
                      "physical_files_after": after["physical_parquet_file_count"],
                      "append_before_seconds": append_before["seconds"],
                      "append_after_seconds": append_after["seconds"],
                      "append_before_peak": append_before["python_peak_bytes"],
                      "append_after_peak": append_after["python_peak_bytes"],
                      "rss_at_n": memory_at_n["rss_bytes"],
                      "rss_pre_compaction": memory_before["rss_bytes"],
                      "rss_after_compaction": memory_after["rss_bytes"],
                      "rss_hwm_after_compaction": memory_after["high_watermark_bytes"],
                      "aggregate_before_seconds": (
                          None if aggregate_before is None else aggregate_before["seconds"]
                      ),
                      "aggregate_after_seconds": (
                          None if aggregate_after is None else aggregate_after["seconds"]
                      ),
                      "compaction_seconds": compact["duration_seconds"],
                      "compaction_total_seconds": compact["measurement"]["seconds"],
                      "files_processed": sum(t["files_processed"] for t in compact["tables"]),
                      "files_created": sum(t["files_created"] for t in compact["tables"]),
                      "snapshot_fingerprints_preserved": (
                          report["snapshot_fingerprints_before"]
                          == report["snapshot_fingerprints_after"]
                      ),
                      "batch_recovery_preserved": report["batch_recovery_preserved"],
                      "destructive_operations": report["destructive_operations"],
                      "duckdb": report["environment"]["duckdb_version"],
                      "ducklake": report["environment"]["ducklake_extension_version"],
                  },
                  sort_keys=True,
              )
          )
          PY
