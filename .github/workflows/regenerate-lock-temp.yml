name: Regenerate lock temp

on:
  push:
    branches: [chore/version-baseline-0.0.1]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Regenerate lock
        run: uv lock

      - name: Commit regenerated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
            exit 0
          fi
          git commit -m "chore(version): uv.lock을 0.0.1 기준으로 갱신"
          git push origin HEAD:chore/version-baseline-0.0.1
