name: Web-next foundation

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src/industrial_phm/runtime/operations_web_http.py"
      - "tests/integration/test_operations_web_next_static.py"
      - "tests/integration/test_operations_web_explore.py"
      - "tests/integration/test_operations_web_phm.py"
      - "tests/acceptance/test_operations_web_next_browser.py"
      - "tests/acceptance/test_operations_web_next_signal_browser.py"
      - "tests/acceptance/test_operations_web_next_departures_browser.py"
      - "tests/acceptance/test_operations_web_next_compare_browser.py"
      - "tests/acceptance/test_operations_web_next_projection_browser.py"
      - "tests/acceptance/test_operations_web_next_briefings_browser.py"
      - "tests/acceptance/test_operations_web_next_acquisition_outlook_browser.py"
      - "src/industrial_phm/runtime/operations_web_forecast.py"
      - "src/industrial_phm/runtime/operations_web_outlook_briefing.py"
      - "tests/integration/test_operations_web_outlook_briefing.py"
      - "src/industrial_phm/runtime/operations_web_outlook_briefing.py"
      - "tests/acceptance/test_operations_web_next_relation_browser.py"
      - "tests/acceptance/test_operations_web_next_review_browser.py"
      - "tests/acceptance/test_operations_web_next_spectrum_browser.py"
      - "tests/acceptance/test_operations_web_next_acquisition_profile_browser.py"
      - "tests/acceptance/test_operations_web_next_acquisition_relation_browser.py"
      - "tests/acceptance/test_operations_web_next_model_evidence_browser.py"
      - "tests/acceptance/test_operations_web_next_outlook_capture_browser.py"
      - "src/industrial_phm/runtime/operations_web_outlook.py"
      - "src/industrial_phm/runtime/operations_web_outlook_capture.py"
      - "tests/unit/test_outlook_capture.py"
      - "src/industrial_phm/runtime/operations_web_review.py"
      - "src/industrial_phm/runtime/operations_web_phm_explanation.py"
      - "src/industrial_phm/runtime/operations_app_actions.py"
      - "src/industrial_phm/application/maintenance_review.py"
      - "src/industrial_phm/application/phm_analysis.py"
      - "tests/integration/test_operations_web_review.py"
      - "tests/integration/test_operations_web_phm_explanation.py"
      - "tests/acceptance/test_operations_web_next_finding_review_browser.py"
      - "tests/support/web_next.py"
      - "tools/verify/**"
      - ".github/workflows/web-next-spike.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/industrial_phm/runtime/operations_web_http.py"
      - "tests/integration/test_operations_web_next_static.py"
      - "tests/integration/test_operations_web_explore.py"
      - "tests/acceptance/test_operations_web_next_**"
      - "src/industrial_phm/runtime/operations_web_outlook_capture.py"
      - "src/industrial_phm/runtime/operations_web_review.py"
      - "tools/verify/**"
      - ".github/workflows/web-next-spike.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load verification toolchain pins
        run: grep -v '^#' tools/verify/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: sh tools/verify/gate.sh frontend-install
      - name: Type and Svelte checks
        run: sh tools/verify/gate.sh frontend-check
      - name: Read DTO parser regression tests
        run: sh tools/verify/gate.sh frontend-test
      - name: Generate packaged assets
        run: sh tools/verify/gate.sh frontend-build
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked runtime
        run: uv sync --locked --extra operations
      - name: Check generated manifest
        run: sh tools/verify/gate.sh manifest
      - name: Python static route integration
        run: sh tools/verify/gate.sh web-next-python
      - name: Verify wheel contains compiled assets
        run: sh tools/verify/gate.sh wheel
      - name: Install Chromium acceptance tools
        run: sh tools/verify/gate.sh browser-runtime
      - name: Web-next Chromium user journey
        run: sh tools/verify/gate.sh web-next-browser
