name: Temporary Operations Contract Acceptance

on:
  push:
    branches: [fix/operations-capability-review-freshness-contract]

permissions:
  contents: read

jobs:
  product-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - run: uv python install 3.14
      - run: uv sync --locked --extra operations --extra aihub
      - run: >-
          uv run --no-sync pytest
          tests/integration/test_operations_web_capabilities.py
          tests/integration/test_operations_web_review.py
          -q -rs --maxfail=1
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run --prefix frontend check
      - run: npm test --prefix frontend
      - run: npm run --prefix frontend build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - run: uv python install 3.14
      - run: uv sync --locked --extra operations --extra aihub
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run --prefix frontend build
      - run: uv pip install --python .venv/bin/python "playwright==1.64.0"
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: >-
          uv run --no-sync pytest
          tests/acceptance/test_operations_web_next_capabilities_browser.py
          tests/acceptance/test_operations_web_next_review_browser.py
          tests/acceptance/test_operations_web_next_monitor_attention_browser.py
          tests/acceptance/test_operations_web_next_electrical_condition_browser.py
          tests/acceptance/test_operations_web_next_investigations_browser.py
          -q -rs --maxfail=1
