name: Operations container

on:
  pull_request:
    paths:
      - '.github/workflows/operations-container.yml'
      - 'compose.yaml'
      - '.dockerignore'
      - 'deploy/container/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - 'src/**'
      - 'frontend/**'
      - 'tools/verify/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/operations-container.yml'
      - 'compose.yaml'
      - '.dockerignore'
      - 'deploy/container/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - 'src/**'
      - 'frontend/**'
      - 'tools/verify/**'

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Packaged stack and volume recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load verification toolchain pins
        run: grep -v '^#' tools/verify/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install host browser
        run: uvx --from "playwright==$PLAYWRIGHT_VERSION" playwright install --with-deps chromium
      - name: Verify full stack and restart through published localhost ports
        run: uvx --from "playwright==$PLAYWRIGHT_VERSION" python tools/verify/container_smoke.py
