name: Temporary showcase media renewal
on:
  push:
    branches: [docs/refresh-product-demo-media]
    paths:
      - "tools/showcase/**"
      - "tools/assets/capture_usecases.py"
      - "assets/README.md"
      - "docs/product/product-showcase.md"
      - ".github/workflows/temporary-showcase-renewal.yml"
permissions:
  contents: write
jobs:
  regenerate:
    name: Regenerate current read-only showcase media
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv python install 3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Install media tooling without changing product dependencies
        run: |
          uv sync --locked --extra history --extra forecast --extra opcua
          uv pip install --python .venv/bin/python "playwright==1.64.0" "pillow>=12,<13"
          uv run --no-sync playwright install --with-deps chromium
      - name: Build current product Web
        run: make frontend
      - name: Re-export real application API results from isolated synthetic workspace
        run: uv run --no-sync python -m tools.showcase.export
      - name: Build read-only static showcase
        run: npm run --prefix frontend build:showcase
      - name: Record current Chromium PNG, GIF and WebM
        run: uv run --no-sync python -m tools.showcase.capture
      - name: Verify source-accurate routes with no API server
        run: uv run --no-sync python -m tools.showcase.capture --no-media
      - name: Commit real captured evidence, not generated illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase/ examples/operations/showcase/
          if ! git diff --cached --quiet; then
            git commit -m "docs(showcase): refresh browser-captured media and API snapshot [skip ci]"
            git push origin HEAD:docs/refresh-product-demo-media
          fi
