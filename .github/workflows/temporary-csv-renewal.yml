name: Temporary CSV media renewal
on:
  push:
    branches: [docs/refresh-product-demo-media]
    paths:
      - "tools/assets/refresh_csv_media.py"
      - ".github/workflows/temporary-csv-renewal.yml"
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv python install 3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Install product and capture tools
        run: |
          uv sync --locked --extra history --extra forecast --extra opcua
          uv pip install --python .venv/bin/python "playwright==1.64.0" "pillow>=12,<13"
          uv run --no-sync playwright install --with-deps chromium
      - run: make frontend
      - name: Capture synthetic CSV onboarding, analysis, forecast and saved review
        run: uv run --no-sync python -m tools.assets.refresh_csv_media
      - name: Commit only actual current CSV screenshots and GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/csv/
          if ! git diff --cached --quiet; then
            git commit -m "docs(csv): renew browser-captured onboarding and review media [skip ci]"
            git push origin HEAD:docs/refresh-product-demo-media
          fi
