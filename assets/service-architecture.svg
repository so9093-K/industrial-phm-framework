<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHM 서비스 아키텍처</title>
  <desc id="desc">검증된 모델 artifact가 inference pipeline을 통해 structured PHM result를 만들고 dashboard와 GenAI가 같은 결과 계약을 소비하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9fd"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8398b3"/></marker>
    <style>
      .title{font:700 54px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0a2047}
      .subtitle{font:400 23px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#61738e}
      .eyebrow{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:5px;fill:#7e92ae}
      .panelTitle{font:700 27px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0a2047;text-anchor:middle}
      .panelSub{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#627795;text-anchor:middle}
      .item{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173862}
      .small{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#667b96}
      .tag{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#2c5d9b;text-anchor:middle}
      .arrow{stroke:#8398b3;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#d9e3ef;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="32" y="20" width="72" height="6" rx="3" fill="#6b9cff"/>
  <text x="32" y="92" class="title">서비스 아키텍처</text>
  <text x="32" y="132" class="subtitle">모델 artifact에서 사용자 전달까지, 하나의 PHM Result contract를 중심으로 분리된 서비스 구조</text>
  <text x="1560" y="48" text-anchor="end" class="eyebrow">PHM SERVICE ARCHITECTURE</text>
  <text x="1560" y="76" text-anchor="end" class="eyebrow" style="font-size:11px;letter-spacing:3px">ARTIFACT  ›  INFERENCE  ›  RESULT  ›  CONSUMER  ›  USER</text>

  <rect x="42" y="210" width="250" height="548" rx="16" fill="#f0f8ff" stroke="#8cc8ff" stroke-width="2"/>
  <rect x="322" y="210" width="250" height="548" rx="16" fill="#f1fbf7" stroke="#93dfc8" stroke-width="2"/>
  <rect x="602" y="210" width="300" height="548" rx="16" fill="#f5f3ff" stroke="#b8adff" stroke-width="2"/>
  <rect x="932" y="210" width="300" height="548" rx="16" fill="#fff9ef" stroke="#ffc875" stroke-width="2"/>
  <rect x="1262" y="210" width="296" height="548" rx="16" fill="#fff2f5" stroke="#ffabc0" stroke-width="2"/>

  <text x="167" y="262" class="panelTitle">Model Artifact</text>
  <text x="167" y="294" class="panelSub">재현 가능한 실행 자산</text>
  <text x="447" y="262" class="panelTitle">Inference Pipeline</text>
  <text x="447" y="294" class="panelSub">학습과 동일한 처리 경계</text>
  <text x="752" y="262" class="panelTitle">PHM Result</text>
  <text x="752" y="294" class="panelSub">구조화된 서비스 계약</text>
  <text x="1082" y="262" class="panelTitle">Consumers</text>
  <text x="1082" y="294" class="panelSub">결과를 독립적으로 소비</text>
  <text x="1410" y="262" class="panelTitle">사용자 · 실행</text>
  <text x="1410" y="294" class="panelSub">역할 기반 정보와 승인</text>

  <!-- artifact -->
  <rect x="68" y="338" width="198" height="70" rx="12" class="box"/><text x="92" y="381" class="item">학습된 모델</text>
  <rect x="68" y="428" width="198" height="70" rx="12" class="box"/><text x="92" y="471" class="item">전처리 · 특징 설정</text>
  <rect x="68" y="518" width="198" height="70" rx="12" class="box"/><text x="92" y="561" class="item">threshold · config</text>
  <rect x="68" y="608" width="198" height="108" rx="12" fill="#e5f3ff" stroke="#c7e5ff"/><text x="167" y="641" class="tag">Provenance</text><text x="167" y="668" class="small" text-anchor="middle">dataset · code revision</text><text x="167" y="692" class="small" text-anchor="middle">evaluation summary</text>

  <!-- inference -->
  <rect x="348" y="338" width="198" height="76" rx="12" class="box"/><text x="372" y="373" class="item">입력 validation</text><text x="372" y="397" class="small">schema · data quality</text>
  <rect x="348" y="434" width="198" height="76" rx="12" class="box"/><text x="372" y="469" class="item">전처리 재사용</text><text x="372" y="493" class="small">training과 동일 규칙</text>
  <rect x="348" y="530" width="198" height="76" rx="12" class="box"/><text x="372" y="565" class="item">모델 추론</text><text x="372" y="589" class="small">score · prediction</text>
  <rect x="348" y="626" width="198" height="90" rx="12" fill="#def7ee" stroke="#bcebdc"/><text x="447" y="660" class="tag">deterministic PHM</text><text x="447" y="686" class="small" text-anchor="middle">수치 source of truth</text>

  <!-- result -->
  <rect x="628" y="332" width="248" height="88" rx="12" class="box"/><text x="652" y="367" class="item">Assessment</text><text x="652" y="393" class="small">status · anomaly · HI · RUL</text>
  <rect x="628" y="440" width="248" height="88" rx="12" class="box"/><text x="652" y="475" class="item">Evidence</text><text x="652" y="501" class="small">trend · quality · context</text>
  <rect x="628" y="548" width="248" height="88" rx="12" class="box"/><text x="652" y="583" class="item">Provenance</text><text x="652" y="609" class="small">artifact · config · data lineage</text>
  <rect x="628" y="656" width="248" height="60" rx="12" fill="#e7e4ff" stroke="#d2ccff"/><text x="752" y="692" class="tag">capability unavailable도 명시</text>

  <!-- consumers -->
  <rect x="958" y="332" width="248" height="156" rx="12" class="box"/><text x="982" y="370" class="item">Dashboard</text><text x="982" y="400" class="small">설비 상태 monitoring</text><text x="982" y="426" class="small">trend · evidence visualization</text><text x="982" y="452" class="small">fleet / asset view</text>
  <rect x="958" y="512" width="248" height="204" rx="12" fill="#fff0f3" stroke="#ffd0dc"/><text x="982" y="550" class="item">GenAI + RAG</text><text x="982" y="580" class="small">상태 해석</text><text x="982" y="606" class="small">가능 원인과 대안 가설</text><text x="982" y="632" class="small">정비 권고 초안</text><text x="982" y="658" class="small">보고서 생성</text><text x="1082" y="690" class="tag">PHM 수치를 재계산하지 않음</text>

  <!-- user -->
  <rect x="1288" y="332" width="244" height="86" rx="12" class="box"/><text x="1312" y="369" class="item">설비 관리자</text><text x="1312" y="395" class="small">상태 · alert · fleet overview</text>
  <rect x="1288" y="438" width="244" height="86" rx="12" class="box"/><text x="1312" y="475" class="item">정비 엔지니어</text><text x="1312" y="501" class="small">evidence · trend · 정비 계획</text>
  <rect x="1288" y="544" width="244" height="86" rx="12" class="box"/><text x="1312" y="581" class="item">의사결정자</text><text x="1312" y="607" class="small">risk · urgency · priority</text>
  <rect x="1288" y="650" width="244" height="66" rx="12" fill="#ffe2e9" stroke="#ffc2d1"/><text x="1410" y="689" class="tag">Human approval boundary</text>

  <path d="M292 484 H316" class="arrow"/><path d="M572 484 H596" class="arrow"/><path d="M902 484 H926" class="arrow"/><path d="M1232 484 H1256" class="arrow"/>

  <rect x="42" y="808" width="1516" height="60" rx="14" fill="#eef5fc"/>
  <text x="800" y="845" text-anchor="middle" class="small" style="font-size:17px">Dashboard와 GenAI는 모델 구현이 아니라 동일한 PHM Result contract를 소비하며, 실행 조치는 사용자 승인 경계를 통과</text>
</svg>
