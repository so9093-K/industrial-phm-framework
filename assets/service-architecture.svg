  </marker>
  <style>
    .title{font:700 52px system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;fill:#0b1f3a}
    .subtitle{font:500 24px system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;fill:#64748b}
    .eyebrow{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:5px;fill:#7890ae}
