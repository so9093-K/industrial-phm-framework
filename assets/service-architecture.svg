<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHM 서비스 아키텍처</title>
  <desc id="desc">검증된 모델 artifact와 inference가 하나의 PHM Result를 만들고 Dashboard와 GenAI가 같은 결과 계약을 독립적으로 소비한 뒤 사람이 조치를 승인하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#63758c"/></marker>
    <style>
      .title{font:700 52px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43}
      .subtitle{font:500 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581}
      .step{font:700 27px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43;text-anchor:middle}
      .body{font:500 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334e68;text-anchor:middle}
      .small{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581;text-anchor:middle}
      .focus{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173f5f;text-anchor:middle}
      .arrow{stroke:#63758c;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="56" y="84" class="title">서비스 아키텍처</text>
  <text x="56" y="128" class="subtitle">목표: Dashboard와 GenAI가 모델 내부가 아니라 같은 PHM 결과 계약을 소비하게 한다</text>

  <g>
    <rect x="62" y="245" width="260" height="410" rx="24" fill="#eef7ff" stroke="#8fc7f5" stroke-width="3"/>
    <text x="192" y="304" class="step">1. Model Artifact</text>
    <text x="192" y="368" class="body">학습된 모델</text>
    <text x="192" y="406" class="body">전처리 · threshold</text>
    <text x="192" y="444" class="body">config · provenance</text>
    <rect x="92" y="520" width="200" height="86" rx="18" fill="#ffffff" stroke="#c9dff2" stroke-width="2"/>
    <text x="192" y="556" class="focus">재현 가능한 실행 자산</text>
    <text x="192" y="586" class="small">data · code · evaluation</text>
  </g>

  <g>
    <rect x="366" y="245" width="260" height="410" rx="24" fill="#eefbf5" stroke="#8dd6b7" stroke-width="3"/>
    <text x="496" y="304" class="step">2. Inference</text>
    <text x="496" y="368" class="body">입력 검증</text>
    <text x="496" y="406" class="body">학습과 동일한 전처리</text>
    <text x="496" y="444" class="body">모델 추론</text>
    <rect x="396" y="520" width="200" height="86" rx="18" fill="#ffffff" stroke="#c9e7da" stroke-width="2"/>
    <text x="496" y="556" class="focus">수치 Source of Truth</text>
    <text x="496" y="586" class="small">deterministic PHM</text>
  </g>

  <g>
    <rect x="670" y="210" width="340" height="480" rx="26" fill="#f4f1ff" stroke="#9d8ed8" stroke-width="4"/>
    <text x="840" y="270" class="step">3. PHM Result</text>
    <text x="840" y="318" class="small">서비스의 중심 계약</text>
    <rect x="708" y="352" width="264" height="66" rx="16" fill="#ffffff" stroke="#d8d0f3" stroke-width="2"/>
    <text x="840" y="393" class="body">상태 · 점수 · HI · RUL</text>
    <rect x="708" y="438" width="264" height="66" rx="16" fill="#ffffff" stroke="#d8d0f3" stroke-width="2"/>
    <text x="840" y="479" class="body">근거 · 설명(XAI)</text>
    <rect x="708" y="524" width="264" height="66" rx="16" fill="#ffffff" stroke="#d8d0f3" stroke-width="2"/>
    <text x="840" y="565" class="body">불확실성 · 적용 범위</text>
    <rect x="708" y="610" width="264" height="48" rx="16" fill="#e7e2fb"/>
    <text x="840" y="641" class="small">artifact · config · data lineage</text>
  </g>

  <g>
    <rect x="1054" y="245" width="260" height="410" rx="24" fill="#fff8e9" stroke="#e8bd69" stroke-width="3"/>
    <text x="1184" y="304" class="step">4. 결과 소비</text>
    <rect x="1084" y="350" width="200" height="108" rx="18" fill="#ffffff" stroke="#ead8ae" stroke-width="2"/>
    <text x="1184" y="392" class="focus">Dashboard</text>
    <text x="1184" y="426" class="small">상태 · trend · evidence</text>
    <rect x="1084" y="486" width="200" height="120" rx="18" fill="#ffffff" stroke="#ead8ae" stroke-width="2"/>
    <text x="1184" y="528" class="focus">GenAI + RAG</text>
    <text x="1184" y="562" class="small">해석 · 가설 · 권고 초안</text>
    <text x="1184" y="590" class="small">PHM 수치를 재계산하지 않음</text>
  </g>

  <g>
    <rect x="1358" y="245" width="184" height="410" rx="24" fill="#fff1f4" stroke="#e9a4b4" stroke-width="3"/>
    <text x="1450" y="304" class="step">5. 사람의 판단</text>
    <text x="1450" y="378" class="body">설비 관리자</text>
    <text x="1450" y="416" class="body">정비 엔지니어</text>
    <text x="1450" y="454" class="body">의사결정자</text>
    <rect x="1380" y="520" width="140" height="86" rx="18" fill="#ffffff" stroke="#efcbd3" stroke-width="2"/>
    <text x="1450" y="556" class="focus">승인 경계</text>
    <text x="1450" y="586" class="small">실행은 사람이 결정</text>
  </g>

  <path d="M322 450 H358" class="arrow"/>
  <path d="M626 450 H662" class="arrow"/>
  <path d="M1010 450 H1046" class="arrow"/>
  <path d="M1314 450 H1350" class="arrow"/>

  <rect x="120" y="746" width="1360" height="92" rx="22" fill="#f3f6f9" stroke="#d9e2ec" stroke-width="2"/>
  <text x="800" y="785" class="focus">서비스의 핵심</text>
  <text x="800" y="818" class="body">Dashboard와 GenAI는 서로를 거치지 않고 같은 PHM Result를 소비하며 · 실제 정비 조치는 사람의 승인을 거친다</text>
</svg>
