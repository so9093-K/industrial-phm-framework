<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">서비스 아키텍처</title>
  <desc id="desc">학습된 모델 아티팩트가 추론 서비스와 대시보드, 생성형 AI를 거쳐 사용자에게 제공되는 구조</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <style>
    .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.txt{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033;text-anchor:middle}.sub{font:500 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <text x="600" y="62" class="title" text-anchor="middle">서비스 아키텍처</text>

  <rect x="85" y="260" rx="18" width="180" height="110" class="box"/>
  <text x="175" y="307" class="txt">Model Artifacts</text>
  <text x="175" y="337" class="sub">Model · Scaler · Metadata</text>

  <rect x="345" y="240" rx="18" width="200" height="150" class="accent"/>
  <text x="445" y="295" class="txt">Inference Service</text>
  <text x="445" y="328" class="sub">공통 추론 파이프라인</text>
  <text x="445" y="356" class="sub">Structured PHM Result</text>

  <rect x="640" y="155" rx="18" width="190" height="110" class="box"/>
  <text x="735" y="202" class="txt">Dashboard / API</text>
  <text x="735" y="232" class="sub">상태 · 추세 · 예측</text>

  <rect x="640" y="370" rx="18" width="190" height="110" class="box"/>
  <text x="735" y="417" class="txt">Generative AI + RAG</text>
  <text x="735" y="447" class="sub">해석 · 설명 · 정비 권고</text>

  <rect x="945" y="260" rx="18" width="170" height="110" class="box"/>
  <text x="1030" y="325" class="txt">사용자</text>

  <path d="M265 315H345" class="arrow"/>
  <path d="M545 290C590 290 590 210 640 210" class="arrow"/>
  <path d="M545 340C590 340 590 425 640 425" class="arrow"/>
  <path d="M830 210C900 210 900 290 945 300" class="arrow"/>
  <path d="M830 425C900 425 900 345 945 335" class="arrow"/>
</svg>