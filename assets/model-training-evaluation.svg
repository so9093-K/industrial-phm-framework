<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHM 모델 학습 및 평가 파이프라인</title>
  <desc id="desc">데이터 provenance 확인, Asset Run 단위 분할, 모델 학습, PHM 출력과 설명 근거 생성, 독립 평가와 비교까지의 재현 가능한 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#63758c"/></marker>
    <style>
      .title{font:700 52px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43}
      .subtitle{font:500 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581}
      .step{font:700 27px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43;text-anchor:middle}
      .body{font:500 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334e68;text-anchor:middle}
      .small{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581;text-anchor:middle}
      .focus{font:700 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173f5f;text-anchor:middle}
      .arrow{stroke:#63758c;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="56" y="84" class="title">모델 학습 및 평가</text>
  <text x="56" y="128" class="subtitle">목표: leakage 없이 학습하고, 같은 기준으로 성능·불확실성·설명 근거를 비교한다</text>

  <g>
    <rect x="58" y="235" width="270" height="440" rx="24" fill="#eef7ff" stroke="#8fc7f5" stroke-width="3"/>
    <text x="193" y="294" class="step">1. 데이터 준비</text>
    <text x="193" y="358" class="body">검증된 raw source</text>
    <text x="193" y="396" class="body">공통 계약 · provenance</text>
    <text x="193" y="434" class="body">label / RUL capability</text>
    <rect x="88" y="520" width="210" height="104" rx="18" fill="#ffffff" stroke="#c9dff2" stroke-width="2"/>
    <text x="193" y="562" class="focus">무엇을 평가할 수 있는가?</text>
    <text x="193" y="596" class="small">데이터가 지원하는 task만 사용</text>
  </g>

  <g>
    <rect x="366" y="235" width="270" height="440" rx="24" fill="#eefbf5" stroke="#8dd6b7" stroke-width="3"/>
    <text x="501" y="294" class="step">2. 분할 · 전처리</text>
    <text x="501" y="354" class="body">Asset / Run 단위 split</text>
    <text x="501" y="392" class="body">Train / Validation / Test</text>
    <text x="501" y="430" class="body">정규화 · window · feature</text>
    <rect x="396" y="500" width="210" height="124" rx="18" fill="#ffffff" stroke="#c9e7da" stroke-width="2"/>
    <text x="501" y="542" class="focus">Leakage 차단</text>
    <text x="501" y="578" class="small">scaler · threshold fit은</text>
    <text x="501" y="606" class="small">train에서만 수행</text>
  </g>

  <g>
    <rect x="674" y="235" width="270" height="440" rx="24" fill="#f4f1ff" stroke="#b4a7ed" stroke-width="3"/>
    <text x="809" y="294" class="step">3. 모델 학습</text>
    <text x="809" y="358" class="body">Isolation Forest</text>
    <text x="809" y="396" class="body">LSTM Autoencoder</text>
    <text x="809" y="434" class="body">향후 교체 가능한 모델</text>
    <rect x="704" y="520" width="210" height="104" rx="18" fill="#ffffff" stroke="#d8d0f3" stroke-width="2"/>
    <text x="809" y="562" class="focus">공통 입력·출력 경계</text>
    <text x="809" y="596" class="small">모델이 core 구조를 정의하지 않음</text>
  </g>

  <g>
    <rect x="982" y="235" width="270" height="440" rx="24" fill="#fff8e9" stroke="#e8bd69" stroke-width="3"/>
    <text x="1117" y="294" class="step">4. PHM 출력</text>
    <text x="1117" y="350" class="body">이상 점수 · HI · RUL</text>
    <text x="1117" y="388" class="body">설명 근거(XAI)</text>
    <text x="1117" y="426" class="body">불확실성 · 적용 범위</text>
    <rect x="1012" y="500" width="210" height="124" rx="18" fill="#ffffff" stroke="#ead8ae" stroke-width="2"/>
    <text x="1117" y="542" class="focus">모델에 맞는 근거</text>
    <text x="1117" y="578" class="small">feature attribution 또는</text>
    <text x="1117" y="606" class="small">채널·시간별 residual</text>
  </g>

  <g>
    <rect x="1290" y="235" width="252" height="440" rx="24" fill="#fff1f4" stroke="#e9a4b4" stroke-width="3"/>
    <text x="1416" y="294" class="step">5. 독립 평가 · 비교</text>
    <text x="1416" y="350" class="body">Anomaly: PR-AUC · FAR</text>
    <text x="1416" y="388" class="body">Prognostics: MAE · RMSE</text>
    <text x="1416" y="426" class="body">Early detection · calibration</text>
    <rect x="1318" y="500" width="196" height="124" rx="18" fill="#ffffff" stroke="#efcbd3" stroke-width="2"/>
    <text x="1416" y="542" class="focus">동일 조건 비교</text>
    <text x="1416" y="578" class="small">same split · evaluator</text>
    <text x="1416" y="606" class="small">config · code provenance</text>
  </g>

  <path d="M328 455 H358" class="arrow"/>
  <path d="M636 455 H666" class="arrow"/>
  <path d="M944 455 H974" class="arrow"/>
  <path d="M1252 455 H1282" class="arrow"/>

  <rect x="126" y="728" width="1348" height="104" rx="22" fill="#f3f6f9" stroke="#d9e2ec" stroke-width="2"/>
  <text x="800" y="772" class="focus">실험의 핵심</text>
  <text x="800" y="808" class="body">Asset/Run 분할과 train-only fit을 먼저 고정한 뒤 · 모델 성능과 설명 가능성을 같은 evaluator에서 검증한다</text>
</svg>
