<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHM 시스템 아키텍처</title>
  <desc id="desc">산업 설비 데이터가 Domain Adapter와 canonical contract를 거쳐 PHM capability, evaluation, structured result, dashboard와 생성형 AI로 전달되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9fd"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8398b3"/></marker>
    <style>
      .title{font:700 54px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0a2047}
      .subtitle{font:400 23px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#61738e}
      .eyebrow{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:5px;fill:#7e92ae}
      .panelTitle{font:700 27px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0a2047;text-anchor:middle}
      .panelSub{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#627795;text-anchor:middle}
      .item{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173862}
      .small{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#667b96}
      .tag{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#2c5d9b;text-anchor:middle}
      .arrow{stroke:#8398b3;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#d9e3ef;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="32" y="20" width="72" height="6" rx="3" fill="#6b9cff"/>
  <text x="32" y="92" class="title">시스템 아키텍처</text>
  <text x="32" y="132" class="subtitle">이기종 산업 데이터를 PHM 결과와 의사결정 지원까지 연결하는 모듈형 구조</text>
  <text x="1560" y="48" text-anchor="end" class="eyebrow">PHM SYSTEM ARCHITECTURE</text>
  <text x="1560" y="76" text-anchor="end" class="eyebrow" style="font-size:11px;letter-spacing:3px">DATA  ›  PHM  ›  RESULT  ›  DECISION</text>

  <!-- panels -->
  <rect x="28" y="190" width="220" height="590" rx="16" fill="#f0f8ff" stroke="#8cc8ff" stroke-width="2"/>
  <rect x="270" y="190" width="220" height="590" rx="16" fill="#f1fbf7" stroke="#93dfc8" stroke-width="2"/>
  <rect x="512" y="190" width="300" height="590" rx="16" fill="#f5f3ff" stroke="#b8adff" stroke-width="2"/>
  <rect x="834" y="190" width="220" height="590" rx="16" fill="#fff9ef" stroke="#ffc875" stroke-width="2"/>
  <rect x="1076" y="190" width="230" height="590" rx="16" fill="#eff8ff" stroke="#80c5ff" stroke-width="2"/>
  <rect x="1328" y="190" width="244" height="590" rx="16" fill="#fff2f5" stroke="#ffabc0" stroke-width="2"/>

  <!-- titles -->
  <text x="138" y="238" class="panelTitle">산업 설비 데이터</text>
  <text x="138" y="270" class="panelSub">원천 형식과 modality</text>
  <text x="380" y="238" class="panelTitle">Domain Adapter</text>
  <text x="380" y="270" class="panelSub">형식·의미 변환 경계</text>
  <text x="662" y="238" class="panelTitle">공통 PHM Core</text>
  <text x="662" y="270" class="panelSub">도메인 중립 capability</text>
  <text x="944" y="238" class="panelTitle">평가</text>
  <text x="944" y="270" class="panelSub">모델과 독립된 검증</text>
  <text x="1191" y="238" class="panelTitle">PHM Result</text>
  <text x="1191" y="270" class="panelSub">구조화된 분석 결과</text>
  <text x="1450" y="238" class="panelTitle">서비스 · 사용자</text>
  <text x="1450" y="270" class="panelSub">해석과 실행 지원</text>

  <!-- data items -->
  <rect x="52" y="318" width="172" height="72" rx="12" class="box"/><text x="76" y="360" class="item">진동 · 음향</text>
  <rect x="52" y="408" width="172" height="72" rx="12" class="box"/><text x="76" y="450" class="item">온도 · 압력</text>
  <rect x="52" y="498" width="172" height="72" rx="12" class="box"/><text x="76" y="540" class="item">운전 로그</text>
  <rect x="52" y="588" width="172" height="104" rx="12" fill="#e5f3ff" stroke="#c7e5ff"/><text x="138" y="624" text-anchor="middle" class="tag">Asset / Run</text><text x="138" y="650" text-anchor="middle" class="small">source provenance</text><text x="138" y="674" text-anchor="middle" class="small">sampling metadata</text>

  <!-- adapter -->
  <rect x="294" y="318" width="172" height="78" rx="12" class="box"/><text x="318" y="352" class="item">Parsing</text><text x="318" y="376" class="small">파일 · 채널 해석</text>
  <rect x="294" y="418" width="172" height="78" rx="12" class="box"/><text x="318" y="452" class="item">Semantic mapping</text><text x="318" y="476" class="small">label · unit · metadata</text>
  <rect x="294" y="518" width="172" height="78" rx="12" class="box"/><text x="318" y="552" class="item">Canonical output</text><text x="318" y="576" class="small">공통 데이터 계약</text>
  <rect x="294" y="618" width="172" height="74" rx="12" fill="#def7ee" stroke="#bcebdc"/><text x="380" y="648" text-anchor="middle" class="tag">dataset logic stays</text><text x="380" y="672" text-anchor="middle" class="tag">at the edge</text>

  <!-- core -->
  <rect x="538" y="314" width="248" height="88" rx="12" class="box"/><text x="562" y="350" class="item">전처리 · 특징</text><text x="562" y="376" class="small">windowing · normalization · features</text>
  <rect x="538" y="422" width="248" height="74" rx="12" class="box"/><text x="562" y="467" class="item">이상 탐지</text>
  <rect x="538" y="516" width="248" height="74" rx="12" class="box"/><text x="562" y="561" class="item">건전성 평가</text>
  <rect x="538" y="610" width="248" height="74" rx="12" class="box"/><text x="562" y="655" class="item">예후 분석 · RUL</text>
  <rect x="538" y="704" width="248" height="46" rx="12" fill="#e6e2ff"/><text x="662" y="733" class="tag">Reference: IF · LSTM-AE · future models</text>

  <!-- evaluation -->
  <rect x="858" y="320" width="172" height="94" rx="12" class="box"/><text x="882" y="354" class="item">Anomaly</text><text x="882" y="380" class="small">PR-AUC · F1 · FAR</text><text x="882" y="402" class="small">early detection</text>
  <rect x="858" y="438" width="172" height="94" rx="12" class="box"/><text x="882" y="472" class="item">Prognostics</text><text x="882" y="498" class="small">MAE · RMSE</text><text x="882" y="520" class="small">calibration</text>
  <rect x="858" y="556" width="172" height="94" rx="12" class="box"/><text x="882" y="590" class="item">Comparison</text><text x="882" y="616" class="small">same split</text><text x="882" y="638" class="small">same evaluator</text>
  <rect x="858" y="674" width="172" height="58" rx="12" fill="#fff0cf"/><text x="944" y="709" class="tag">task-aware metrics</text>

  <!-- result -->
  <rect x="1100" y="318" width="182" height="82" rx="12" class="box"/><text x="1124" y="352" class="item">Assessment</text><text x="1124" y="378" class="small">score · HI · RUL</text>
  <rect x="1100" y="420" width="182" height="82" rx="12" class="box"/><text x="1124" y="454" class="item">Evidence</text><text x="1124" y="480" class="small">trend · quality · context</text>
  <rect x="1100" y="522" width="182" height="82" rx="12" class="box"/><text x="1124" y="556" class="item">Provenance</text><text x="1124" y="582" class="small">artifact · config · data</text>
  <rect x="1100" y="624" width="182" height="82" rx="12" fill="#dff0ff" stroke="#b9dcfa"/><text x="1191" y="658" class="tag">single service</text><text x="1191" y="682" class="tag">contract</text>

  <!-- service/users -->
  <rect x="1352" y="314" width="196" height="72" rx="12" class="box"/><text x="1376" y="358" class="item">Inference API</text>
  <rect x="1352" y="406" width="196" height="72" rx="12" class="box"/><text x="1376" y="450" class="item">Dashboard</text>
  <rect x="1352" y="498" width="196" height="96" rx="12" class="box"/><text x="1376" y="534" class="item">GenAI + RAG</text><text x="1376" y="560" class="small">해석 · 가설 · 권고</text><text x="1376" y="582" class="small">수치 source of truth 아님</text>
  <rect x="1352" y="614" width="196" height="96" rx="12" fill="#ffe2e9" stroke="#ffc2d1"/><text x="1450" y="648" class="tag">관리자 · 엔지니어</text><text x="1450" y="674" class="tag">의사결정자</text><text x="1450" y="696" class="small" text-anchor="middle">human approval boundary</text>

  <!-- arrows -->
  <path d="M248 485 H264" class="arrow"/><path d="M490 485 H506" class="arrow"/><path d="M812 485 H828" class="arrow"/><path d="M1054 485 H1070" class="arrow"/><path d="M1306 485 H1322" class="arrow"/>

  <rect x="28" y="812" width="1544" height="58" rx="14" fill="#eef5fc"/>
  <text x="800" y="848" text-anchor="middle" class="small" style="font-size:17px">핵심 경계: Acquisition은 Adapter 앞에서, 도메인 지식은 Adapter 안에서, 모델 결과는 PHM Result를 통해 서비스로 전달</text>
</svg>
