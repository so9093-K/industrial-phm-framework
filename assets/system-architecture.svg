<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHM 시스템 아키텍처</title>
  <desc id="desc">데이터셋 차이는 Domain Adapter에서 흡수하고, 공통 PHM 처리와 독립 평가를 거쳐 구조화된 PHM 결과를 생성한 뒤 사용자 의사결정을 지원하는 전체 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#63758c"/></marker>
    <style>
      .title{font:700 52px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43}
      .subtitle{font:500 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581}
      .step{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#102a43;text-anchor:middle}
      .body{font:500 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334e68;text-anchor:middle}
      .small{font:500 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#486581;text-anchor:middle}
      .focus{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#173f5f;text-anchor:middle}
      .arrow{stroke:#63758c;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="56" y="84" class="title">시스템 아키텍처</text>
  <text x="56" y="128" class="subtitle">목표: 데이터셋이 달라도 같은 PHM·평가·서비스 흐름을 재사용한다</text>

  <g>
    <rect x="48" y="230" width="220" height="410" rx="24" fill="#eef7ff" stroke="#8fc7f5" stroke-width="3"/>
    <text x="158" y="286" class="step">1. 원천 산업 데이터</text>
    <text x="158" y="350" class="body">진동 · 음향 · 센서</text>
    <text x="158" y="386" class="body">운전 로그 · 메타데이터</text>
    <rect x="76" y="472" width="164" height="108" rx="18" fill="#ffffff" stroke="#c9dff2" stroke-width="2"/>
    <text x="158" y="514" class="focus">Asset / Run</text>
    <text x="158" y="548" class="small">source · sampling</text>
  </g>

  <g>
    <rect x="306" y="230" width="220" height="410" rx="24" fill="#eefbf5" stroke="#8dd6b7" stroke-width="3"/>
    <text x="416" y="286" class="step">2. Domain Adapter</text>
    <text x="416" y="350" class="body">파일·채널 해석</text>
    <text x="416" y="386" class="body">단위·label·metadata 매핑</text>
    <rect x="334" y="472" width="164" height="108" rx="18" fill="#ffffff" stroke="#c9e7da" stroke-width="2"/>
    <text x="416" y="514" class="focus">공통 데이터 계약</text>
    <text x="416" y="548" class="small">도메인 지식은 여기까지</text>
  </g>

  <g>
    <rect x="564" y="230" width="250" height="410" rx="24" fill="#f4f1ff" stroke="#b4a7ed" stroke-width="3"/>
    <text x="689" y="286" class="step">3. 공통 PHM 처리</text>
    <text x="689" y="344" class="body">전처리 · 특징 추출</text>
    <text x="689" y="380" class="body">이상 탐지 · 건전성 평가</text>
    <text x="689" y="416" class="body">예후 분석 · RUL</text>
    <rect x="594" y="472" width="190" height="108" rx="18" fill="#ffffff" stroke="#d8d0f3" stroke-width="2"/>
    <text x="689" y="514" class="focus">모델별 설명 근거</text>
    <text x="689" y="548" class="small">XAI · residual · attribution</text>
  </g>

  <g>
    <rect x="852" y="230" width="220" height="410" rx="24" fill="#fff8e9" stroke="#e8bd69" stroke-width="3"/>
    <text x="962" y="286" class="step">4. 독립 평가</text>
    <text x="962" y="350" class="body">동일 split · 동일 evaluator</text>
    <text x="962" y="386" class="body">task-aware metric</text>
    <rect x="880" y="472" width="164" height="108" rx="18" fill="#ffffff" stroke="#ead8ae" stroke-width="2"/>
    <text x="962" y="514" class="focus">신뢰성 확인</text>
    <text x="962" y="548" class="small">성능 · 불확실성</text>
  </g>

  <g>
    <rect x="1110" y="230" width="220" height="410" rx="24" fill="#eef7ff" stroke="#8fc7f5" stroke-width="3"/>
    <text x="1220" y="286" class="step">5. PHM Result</text>
    <text x="1220" y="344" class="body">상태 · 점수 · HI · RUL</text>
    <text x="1220" y="380" class="body">근거 · 설명 · 불확실성</text>
    <text x="1220" y="416" class="body">provenance</text>
    <rect x="1138" y="472" width="164" height="108" rx="18" fill="#ffffff" stroke="#c9dff2" stroke-width="2"/>
    <text x="1220" y="514" class="focus">하나의 결과 계약</text>
    <text x="1220" y="548" class="small">지원 불가도 명시</text>
  </g>

  <g>
    <rect x="1368" y="230" width="184" height="410" rx="24" fill="#fff1f4" stroke="#e9a4b4" stroke-width="3"/>
    <text x="1460" y="286" class="step">6. 의사결정 지원</text>
    <text x="1460" y="344" class="body">Dashboard</text>
    <text x="1460" y="380" class="body">GenAI + RAG</text>
    <text x="1460" y="416" class="body">정비 엔지니어</text>
    <rect x="1390" y="472" width="140" height="108" rx="18" fill="#ffffff" stroke="#efcbd3" stroke-width="2"/>
    <text x="1460" y="514" class="focus">Human approval</text>
    <text x="1460" y="548" class="small">조치는 사람이 승인</text>
  </g>

  <path d="M268 435 H298" class="arrow"/>
  <path d="M526 435 H556" class="arrow"/>
  <path d="M814 435 H844" class="arrow"/>
  <path d="M1072 435 H1102" class="arrow"/>
  <path d="M1330 435 H1360" class="arrow"/>

  <rect x="96" y="700" width="1408" height="112" rx="22" fill="#f3f6f9" stroke="#d9e2ec" stroke-width="2"/>
  <text x="800" y="746" class="focus">핵심 경계</text>
  <text x="800" y="784" class="body">데이터셋 차이는 Adapter에서 끝내고 · 모델 수치와 설명 근거는 PHM Result로 묶고 · 서비스는 그 결과만 소비한다</text>
</svg>
