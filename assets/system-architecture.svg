<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">산업 설비 예지보전 시스템 아키텍처</title>
  <desc id="desc">산업 설비 데이터가 도메인 어댑터와 공통 PHM 코어, 평가, 서비스, 생성형 AI를 거쳐 사용자에게 전달되는 구조</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <style>
    .title{font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.core{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.txt{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033;text-anchor:middle}.sub{font:500 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <text x="600" y="62" class="title" text-anchor="middle">산업 설비 예지보전 시스템 아키텍처</text>

  <rect x="55" y="240" rx="18" width="175" height="120" class="box"/>
  <text x="142" y="288" class="txt">산업 설비 데이터</text>
  <text x="142" y="320" class="sub">시계열 · 센서 · 로그</text>

  <rect x="285" y="240" rx="18" width="175" height="120" class="box"/>
  <text x="372" y="288" class="txt">Domain Adapter</text>
  <text x="372" y="320" class="sub">공통 데이터 계약 변환</text>

  <rect x="515" y="205" rx="18" width="205" height="190" class="core"/>
  <text x="617" y="255" class="txt">Common PHM Core</text>
  <text x="617" y="295" class="sub">Anomaly Detection</text>
  <text x="617" y="325" class="sub">Health Assessment</text>
  <text x="617" y="355" class="sub">RUL Prediction</text>

  <rect x="775" y="240" rx="18" width="150" height="120" class="box"/>
  <text x="850" y="288" class="txt">평가</text>
  <text x="850" y="320" class="sub">성능 · 조기 탐지</text>

  <rect x="980" y="170" rx="18" width="165" height="105" class="box"/>
  <text x="1062" y="215" class="txt">서비스</text>
  <text x="1062" y="245" class="sub">API · Dashboard</text>

  <rect x="980" y="330" rx="18" width="165" height="105" class="box"/>
  <text x="1062" y="375" class="txt">생성형 AI</text>
  <text x="1062" y="405" class="sub">LLM + RAG</text>

  <rect x="980" y="500" rx="18" width="165" height="80" class="box"/>
  <text x="1062" y="548" class="txt">사용자</text>

  <path d="M230 300H285" class="arrow"/><path d="M460 300H515" class="arrow"/><path d="M720 300H775" class="arrow"/>
  <path d="M925 280C955 280 955 222 980 222" class="arrow"/><path d="M925 320C955 320 955 382 980 382" class="arrow"/>
  <path d="M1062 275V500" class="arrow"/><path d="M1062 435V500" class="arrow"/>
</svg>