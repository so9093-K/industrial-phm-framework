<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1737 906" width="1737" height="906" role="img" aria-labelledby="title desc">
  <title id="title">시스템 아키텍처</title>
  <desc id="desc">산업 설비 데이터에서 도메인 어댑터, 공통 엣지비전 코어, 평가 및 분석, 서비스 계층, 생성형 AI를 거쳐 사용자에게 이어지는 시스템 아키텍처</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#e5f1fb"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f9"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
    <linearGradient id="groupHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#d9ebfb"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5e5f3" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#b5d1e9"/>
      <stop offset="1" stop-color="#9fc2df"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8aa6bf" flood-opacity=".10"/>
    </filter>
    <style>
      .kr { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .title { fill:#0b315c; font-size:64px; font-weight:800; letter-spacing:-2px; }
      .head { fill:#0c315d; font-size:27px; font-weight:800; }
      .label { fill:#12345c; font-size:22px; font-weight:600; }
      .small { fill:#12345c; font-size:18px; font-weight:500; }
      .tiny { fill:#315373; font-size:16px; font-weight:500; }
      .panel { fill:#fff; stroke:#72a9d8; stroke-width:1.5; }
      .chip { fill:url(#chip); }
      .navy { stroke:#0f447b; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .navyFill { fill:#0f447b; }
    </style>
  </defs>

  <rect width="1737" height="906" fill="#ffffff"/>
  <text class="kr title" x="36" y="148">시스템 아키텍처</text>

  <!-- Column shells -->
