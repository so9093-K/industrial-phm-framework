<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="title desc">
  <title id="title">Industrial PHM의 측정·분석·사용자 흐름</title>
  <desc id="desc">CSV와 OPC UA 측정은 설비 이력에, 베어링 기록 재생의 파형은 진동 측정 저장소에 보존합니다. 저장된 측정과 진동 측정별 특징으로 신호 탐색, 입력 조건에 맞는 모델의 이상 탐지, 기준 도달 전망을 계산합니다. Operations Web에서 결과를 확인하며, 선택적으로 생성형 AI에 계산된 사실을 질문합니다. 사용자는 전망을 저장하고 검토한 뒤 새 관측과 비교합니다. 로컬 실행은 make up이 수집·분석·Web 프로세스를 관리합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#527b8b"/></marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;fill:#183b49}
      .title{font-size:26px;font-weight:700}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1px;fill:#487481}
      .heading{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:600}.body{font-size:17px;fill:#46636e}
      .card{fill:#fff;stroke:#cbdde3;stroke-width:1.5}.line{fill:none;stroke:#527b8b;stroke-width:2;marker-end:url(#arrow)}
      .number{font-size:14px;font-weight:700;fill:#28758a}
    </style>
  </defs>
  <rect width="1200" height="676" rx="18" fill="#f6f9fa"/>
  <text class="eyebrow" x="28" y="36">INDUSTRIAL PHM FRAMEWORK</text>
  <text class="title" x="28" y="78">측정값을 모으고, 변화를 살피고, 기준까지의 여유를 확인합니다</text>
  <g>
    <rect class="card" x="24" y="116" width="264" height="308" rx="12"/>
    <rect class="card" x="320" y="116" width="264" height="308" rx="12"/>
    <rect class="card" x="616" y="116" width="264" height="308" rx="12"/>
    <rect class="card" x="912" y="116" width="264" height="308" rx="12"/>
  </g>
  <g>
    <text class="number" x="44" y="146">01 / INPUT</text><text class="heading" x="44" y="179">설비 데이터</text>
    <text class="label" x="44" y="233">CSV · OPC UA</text>
    <text class="body" x="44" y="261">시간별 측정값·품질·출처</text>
    <path d="M44 285H268" stroke="#e0eaee"/>
    <text class="label" x="44" y="323">XJTU-SY 기록 재생</text>
    <text class="body" x="44" y="351">진동 파형·측정 순서</text>
    <text class="body" x="44" y="390">명시한 설비·신호에 연결</text>
  </g>
  <g>
    <text class="number" x="340" y="146">02 / STORE</text><text class="heading" x="340" y="179">원본과 이력</text>
    <text class="label" x="340" y="233">측정 이력 · DuckLake</text>
    <text class="body" x="340" y="261">원본 시각·단위·출처 보존</text>
    <path d="M340 285H564" stroke="#e0eaee"/>
    <text class="label" x="340" y="323">진동 측정·분석 결과</text>
    <text class="body" x="340" y="351">파형 파일 참조·특징·점수</text>
    <text class="body" x="340" y="390">시간 축과 측정 순서 구별</text>
  </g>
  <g>
    <text class="number" x="636" y="146">03 / ANALYZE</text><text class="heading" x="636" y="179">분석과 전망</text>
    <text class="label" x="636" y="223">신호 탐색·변화 구간</text><text class="body" x="636" y="250">분포·관계·주파수 비교</text>
    <text class="label" x="636" y="293">모델 기반 이상 탐지</text><text class="body" x="636" y="320">입력에 맞는 모델 패키지</text>
    <text class="label" x="636" y="363">상태 전망·미래 예측</text><text class="body" x="636" y="390">관리·종료 기준까지의 여유</text>
  </g>
  <g>
    <text class="number" x="932" y="146">04 / EXPLORE</text><text class="heading" x="932" y="179">Operations Web</text>
    <text class="label" x="932" y="233">설비별 측정 신호</text><text class="body" x="932" y="261">현재 값과 기록의 변화</text>
    <text class="label" x="932" y="313">같은 설비로 화면 이동</text><text class="body" x="932" y="341">구간 비교·이상 탐지·전망</text>
    <text class="body" x="932" y="390">계산에 사용한 근거 확인</text>
  </g>
  <path class="line" d="M289 270H314"/><path class="line" d="M585 270H610"/><path class="line" d="M881 270H906"/>
  <rect x="24" y="462" width="560" height="86" rx="12" fill="#e7f0f4"/>
  <text class="label" x="44" y="495">로컬 실행 · make up</text><text class="body" x="44" y="526">수집·분석·Web 프로세스의 시작과 종료 관리</text>
  <rect x="616" y="462" width="560" height="86" rx="12" fill="#eef5f1" stroke="#b5d0c1" stroke-dasharray="6 4"/>
  <text class="label" x="636" y="495">선택 연결 · 생성형 AI</text><text class="body" x="636" y="526">서버가 계산한 사실을 바탕으로 질문·답변·근거 확인</text>
  <path class="line" d="M748 424V454" stroke-dasharray="5 4"/><path class="line" d="M1044 462V431" stroke-dasharray="5 4"/>
  <rect x="24" y="576" width="1152" height="74" rx="12" fill="#183b49"/>
  <text x="44" y="607" style="font-size:21px;font-weight:700;fill:#fff">사람의 검토와 재관측</text>
  <text x="332" y="620" style="font-size:19px;fill:#edf6f9">근거 확인 → 전망 저장 → 검토 기록 → 새 관측과 비교</text>
  <text x="44" y="632" style="font-size:15px;fill:#c0d9e2">계산 결과와 사람의 판단을 구분</text>
</svg>
